[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-agent"
version = "0.1.0"
description = "Sandboxed terminal agent with a self-debug loop, command policy, and step/cost caps."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Brandon Lopez (Braylo)"}]
keywords = ["agent", "terminal", "sandbox"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
terminal-agent = "terminal_agent.cli:main"

[project.urls]
Repository = "https://github.com/braylo-ai/terminal-agent"

[tool.setuptools.packages.find]
include = ["terminal_agent*"]
